<!DOCTYPE html>

<html lang="{{- site.Language.Lang -}}">
    <head>
        {{- partial "head.html" . -}}
        <link rel="stylesheet" href="/css/404.css">
    </head>

    <body>
        <div class="page">
            <div class="page-header">
                {{- partial "header.html" . -}}
            </div>

            <div class="page-body">
                <main class="page-404-container">
                    <span class="page-404-tag"> Oops! </span>
                    <h1 class="page-404-title"> 404 </h1>
                    <h2 class="page-404-subtitle"> Page Not Found </h2>
                    <p class="page-404-desc">
                        The page you are looking for doesn't exist, has been removed, or is temporarily unavailable.
                    </p>

                    <div class="page-404-actions">
                        <a href="/" class="page-404-btn primary" aria-label="Return Home">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
                                <path d="M9 17.25H15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 2L18.5437 6.06429C20.4649 7.25769 21.4255 7.85439 21.8378 8.6075C22.25 9.36061 22.25 10.4914 22.25 12.753V13.7799C22.25 15.6838 22.25 17.1866 22.0973 18.3616C21.9406 19.567 21.6114 20.5401 20.8676 21.3094C20.1204 22.0824 19.1695 22.4277 17.9924 22.5914C16.8515 22.75 15.3944 22.75 13.5581 22.75H10.4419C8.60556 22.75 7.14849 22.75 6.00761 22.5914C4.83046 22.4277 3.87958 22.0824 3.13236 21.3094C2.38856 20.5401 2.05937 19.567 1.9027 18.3616C1.75 17.1866 1.75 15.6837 1.75 13.7799V12.753C1.75 10.4914 1.75 9.36061 2.16224 8.6075C2.57448 7.85439 3.53509 7.25769 5.45628 6.06429L12 2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span> Return Home </span>
                        </a>
                        <a href="/note" class="page-404-btn secondary" aria-label="Browse Notes">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="20" height="20">
                                <rect width="256" height="256" fill="none"/>
                                <line x1="96" y1="112" x2="176" y2="112" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                                <line x1="96" y1="144" x2="176" y2="144" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                                <path d="M32,200a16,16,0,0,0,16-16V64a8,8,0,0,1,8-8H216a8,8,0,0,1,8,8V184a16,16,0,0,1-16,16Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                                <path d="M32,200a16,16,0,0,1-16-16V88" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
                            </svg>
                            <span> Browse Notes </span>
                        </a>
                    </div>

                    <div class="page-404-quicklinks">
                        <span class="page-404-quicklinks-title"> Quick Links: </span>
                        <div class="page-404-links">
                            <a href="/" class="page-404-link" aria-label="Go to Home"> Home </a>
                            <span class="page-404-dot"> &bull; </span>
                            <a href="/note" class="page-404-link" aria-label="Go to Notes"> Note </a>
                            <span class="page-404-dot"> &bull; </span>
                            <a href="/project" class="page-404-link" aria-label="Go to Projects"> Project </a>
                            <span class="page-404-dot"> &bull; </span>
                            <a href="/contact" class="page-404-link" aria-label="Go to Contact"> Contact </a>
                            <span class="page-404-dot"> &bull; </span>
                            <a href="https://github.com/itsccao" target="_blank" rel="noopener noreferrer" class="page-404-link" aria-label="Visit GitHub profile"> GitHub </a>
                        </div>
                    </div>
                </main>
            </div>

            <div class="page-footer">
                {{- partial "footer.html" . -}}
            </div>
        </div>
    </body>
</html>
