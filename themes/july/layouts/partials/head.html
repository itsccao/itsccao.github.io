<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{{ with .Site.Params.Theme}}
<meta name="theme-color" content="{{ .ThemeColor }}">
{{ end }}

{{ with .Site.Params.About }}
<meta name="title" content="{{ .Title }}">
<meta name="author" content="{{ .Author }}">
<meta name="description" content="{{ .Description }}">

<meta itemprop="name" content="{{ .Title }}">
<meta itemprop="description" content="{{ .Description }}">
<meta itemprop="image" content="{{ .ImageURL | relURL }}">

<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:creator" content="{{ .Author }}">
<meta name="twitter:description" content="{{ .Description }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ .ImageURL | absURL }}">
<meta name="twitter:url" content="{{ .BaseURL }}">

<meta property="og:title" content="{{ .Title }}">
<meta property="og:type" content="website">
<meta property="og:description" content="{{ .Description }}">
<meta property="og:image" content="{{ .ImageURL | absURL }}">
<meta property="og:url" content="{{ .BaseURL }}">
{{ end }}

{{ if .Site.Params.Noindex }}
<meta name="robots" content="noindex">
<meta name="robots" content="nofollow">
{{ end }}

<title>
    {{ .Site.Params.About.Title }}
    {{ if not .IsHome }}
        &#124;
        {{ with .Title }}{{ . }} {{end}}
    {{ end }}
</title>

{{ with .Site.Params.About }}
<link rel="canonical" href="{{ .BaseURL }}">
{{ end }}

<link rel="icon" type="image/png" sizes="16x16" href="{{ "/favicon/favicon-16px.png" | absURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "/favicon/favicon-32px.png" | absURL }}">
<link rel="apple-touch-icon" sizes="192x192" href="{{ "/favicon/favicon-192px.png" | absURL }}">

<link rel="stylesheet" href="{{ "css/july.css" | absURL }}">

<script>
    (function() {
        var saved = localStorage.getItem("pageTheme");
        var theme = (saved === "catppuccin-latte" || saved === "catppuccin-mocha") ? saved : "catppuccin-mocha";
        var link = document.createElement("link");
        link.id = "page-theme-link";
        link.type = "text/css";
        link.rel = "stylesheet";
        link.href = "{{ "css/schemes/" | absURL }}" + theme + ".css";
        document.head.appendChild(link);
    })();
</script>

<noscript>
    <link rel="stylesheet" href="{{ "css/schemes/catppuccin-mocha.css" | absURL }}">
</noscript>
