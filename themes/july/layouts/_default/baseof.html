<!DOCTYPE html>

<html lang="{{- site.Language.Lang -}}">
    <head>
        {{- partial "head.html" . -}}
    </head>

    <body>
        <div class="page">
            <div class="page-header">
                {{- partial "header.html" . -}}
            </div>

            <div class="page-body">
                {{- block "main" . }}{{- end }}
            </div>

            <div class="page-footer">
                {{- partial "footer.html" . -}}
            </div>
        </div>
    </body>
</html>
