<div class="page-header-inner">
    <a class="page-brand" href="{{ if .IsHome }}#intro{{ else }}{{ "" | relURL }}{{ end }}" aria-label="{{ site.Params.About.Title }}">
        {{- range $index, $letter := split site.Params.About.Title "" -}}
            <span class="page-brand-letter" aria-hidden="true" style="--letter-index: {{ $index }}">{{ $letter }}</span>
        {{- end -}}
    </a>
    <nav class="page-nav" aria-label="Main navigation">
        <span class="page-nav-indicator" aria-hidden="true"></span>
        <a class="site-button site-button--quiet" data-home href="{{ if .IsHome }}#intro{{ else }}{{ "" | relURL }}{{ end }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
        <a class="site-button site-button--quiet" href="{{ "note/" | relURL }}"{{ if eq .Section "note" }} aria-current="{{ if .IsSection }}page{{ else }}location{{ end }}"{{ end }}>Notes</a>
        <a class="site-button site-button--quiet" href="{{ "project/" | relURL }}"{{ if eq .Section "project" }} aria-current="{{ if eq .RelPermalink ("project/" | relURL) }}page{{ else }}location{{ end }}"{{ end }}>Projects</a>
        <a class="site-button site-button--quiet" data-contact href="{{ if not .IsHome }}{{ "" | relURL }}{{ end }}#contact">Contact</a>
    </nav>
    <button class="site-button site-button--icon page-theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false" hidden>
        <svg class="page-theme-sun" aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
        </svg>
        <svg class="page-theme-moon" aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M21 13.1A9 9 0 0 1 10.9 3 9 9 0 1 0 21 13.1Z"/>
        </svg>
    </button>
</div>
<script src="{{ "js/header.js" | relURL }}" defer></script>
