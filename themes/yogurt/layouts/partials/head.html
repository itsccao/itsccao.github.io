<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="{{ "font/be-vietnam-pro/BeVietnamPro-Regular.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "font/lora/Lora-Variable.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}">

{{ with .Site.Params.Theme}}
<meta name="theme-color" content="{{ .ThemeColor }}">
{{ end }}

{{ with .Site.Params.About }}
<meta name="title" content="{{ .Title }}">
<meta name="author" content="{{ .Author }}">
<meta name="description" content="{{ .Description }}">

<meta itemprop="name" content="{{ .Title }}">
<meta itemprop="description" content="{{ .Description }}">
<meta itemprop="image" content="{{ .ImageURL | relURL }}">

<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:creator" content="{{ .Author }}">
<meta name="twitter:description" content="{{ .Description }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ .ImageURL | absURL }}">
<meta name="twitter:url" content="{{ .BaseURL }}">

<meta property="og:title" content="{{ .Title }}">
<meta property="og:type" content="website">
<meta property="og:description" content="{{ .Description }}">
<meta property="og:image" content="{{ .ImageURL | absURL }}">
<meta property="og:url" content="{{ .BaseURL }}">
{{ end }}

{{ if .Site.Params.Noindex }}
<meta name="robots" content="noindex">
<meta name="robots" content="nofollow">
{{ end }}

<title>
    {{ .Site.Params.About.Title }}
    {{ if not .IsHome }}
        &#124;
        {{ with .Title }}{{ . }} {{end}}
    {{ end }}
</title>

{{ with .Site.Params.About }}
<link rel="canonical" href="{{ .BaseURL }}">
{{ end }}

<link rel="icon" type="image/png" sizes="16x16" href="{{ "/favicon/favicon-16px.png" | absURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "/favicon/favicon-32px.png" | absURL }}">
<link rel="apple-touch-icon" sizes="192x192" href="{{ "/favicon/favicon-192px.png" | absURL }}">

<script>
    (() => {
        let saved;
        const root = document.documentElement;
        try {
            saved = localStorage.getItem("pageTheme");
        } catch {}
        const light = ["light", "sage-light", "catppuccin-latte"];
        const dark = ["dark", "sage-dark", "catppuccin-mocha"];
        const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        root.dataset.theme = light.includes(saved) ? "light" : dark.includes(saved) ? "dark" : systemTheme;
    })();
</script>

<link rel="stylesheet" href="{{ "css/yogurt.css" | relURL }}">
