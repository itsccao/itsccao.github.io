{{ define "main" }}
    <header class="page-intro">
        <h1>{{ .Title | markdownify }}</h1>
        {{- .Content -}}
    </header>

    <div class="page-list-tag-container page-tag-terms-container">
        {{ range .Data.Terms.Alphabetical }}
            <a class="page-list-tag page-tag-term" href="{{ .Page.RelPermalink }}">
                #{{ .Page.Title }}
                <span class="page-list-tag-count">({{ .Count }})</span>
            </a>
        {{ end }}
    </div>
{{ end }}
