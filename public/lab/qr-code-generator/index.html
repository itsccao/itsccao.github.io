<style>
    #qr-code-input
    {
        width: 100%;
        max-width: 100%;
        min-height: 4rem;
        padding: 0.8rem;
        background-color: var(--off-background);
        border: 2px solid var(--box-shadow-hover);
        border-radius: 0.5rem;
        color: var(--text);
        font-size: 1.1rem;
        resize: vertical;
        transition: border-color 0.2s ease;
    }

    #qr-code-input:focus
    {
        outline: none;
        border-color: var(--link-hover);
    }

    #qr-code-output
    {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 100%;
    }

    #qr-code-output canvas
    {
        max-width: 75%;
        height: auto;
    }

    #qr-code-download-container
    {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #qr-code-download
    {
        padding: 0.75rem 1.5rem;
        background-color: var(--off-background);
        border: 2px solid var(--box-shadow-hover);
        border-radius: 0.5rem;
        color: var(--text);
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.2s ease;
        display: none;
    }

    #qr-code-download:hover
    {
        cursor: pointer;
        border-color: var(--link-hover);
        color: var(--link-hover);
        transform: translateY(-2px);
    }
</style>
