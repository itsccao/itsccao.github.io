<!DOCTYPE html>

<html lang="{{- site.Language.Lang -}}">
    <head>
        {{- partial "head.html" . -}}
        <link rel="stylesheet" href="/css/404.css">
    </head>

    <body>
        <div class="page">
            <div class="page-header">
                {{- partial "header.html" . -}}
            </div>

            <div class="page-body">
                <main class="page-404-container">
                    <span class="page-404-tag"> Oops! </span>
                    <h1 class="page-404-title"> 404 </h1>
                    <h2 class="page-404-subtitle"> Page Not Found </h2>
                    <p class="page-404-desc">
                        The page you are looking for doesn't exist, has been removed, or is temporarily unavailable.
                    </p>

                    <div class="page-404-actions">
                        <a href="/" class="page-404-btn primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                            <span> Return Home </span>
                        </a>
                        <a href="/note" class="page-404-btn secondary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                                <path d="M6 6h10"/>
                                <path d="M6 10h10"/>
                            </svg>
                            <span> Browse Notes </span>
                        </a>
                    </div>

                    <div class="page-404-quicklinks">
                        <span class="page-404-quicklinks-title"> Quick Links: </span>
                        <div class="page-404-links">
                            <a href="/" class="page-404-link"> Home </a>
                            <span class="page-404-dot"> &bull; </span>
                            <a href="/note" class="page-404-link"> Note </a>
                            <span class="page-404-dot"> &bull; </span>
                            <a href="/lab" class="page-404-link"> Lab </a>
                            <span class="page-404-dot"> &bull; </span>
                            <a href="https://github.com/itsccao" target="_blank" rel="noopener noreferrer" class="page-404-link"> GitHub </a>
                        </div>
                    </div>
                </main>
            </div>

            <div class="page-footer">
                {{- partial "footer.html" . -}}
            </div>
        </div>
    </body>
</html>
