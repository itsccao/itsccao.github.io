<div class="weather-wrapper">
    <div class="weather-credit-bar">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <span>Weather and air quality data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo API</a></span>
    </div>

    <div class="weather-search-card">
        <label for="weather-input" class="weather-search-label">Search weather by location:</label>
        <div class="weather-search-box">
            <input type="text" id="weather-input" placeholder="Enter city name (e.g. Ho Chi Minh, Tokyo, London)..." autofocus>
            <button type="button" id="weather-submit" class="weather-search-btn" aria-label="Search weather">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span>Search</span>
            </button>
        </div>

        <div class="weather-quick-tags">
            <span class="weather-quick-label">Quick suggestions:</span>
            <button type="button" class="weather-quick-btn" onclick="quickSearch('Ho Chi Minh')">Ho Chi Minh City</button>
            <button type="button" class="weather-quick-btn" onclick="quickSearch('Tokyo')">Tokyo</button>
        </div>
    </div>

    <p id="weather-error" class="weather-error-text"></p>

    <div class="weather-history-section">
        <h2 class="weather-history-title">Recent Forecasts</h2>
        <div id="weather-result" class="weather-results-container"></div>
    </div>
</div>

<script>
function quickSearch(city) {
    const input = document.getElementById('weather-input');
    if (input) {
        input.value = city;
        document.getElementById('weather-submit')?.click();
    }
}
</script>
<script src="/js/toolbox/weather-forecast.js"></script>
